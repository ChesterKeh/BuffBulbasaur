<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Common Table — Partnerships, made warmly</title>
<meta name="description" content="Common Table matches homegrown brands, cafés and startups in Singapore, and builds collaborations together.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ================= Common Table: plain, hand-written CSS ================= */
:root{
  --accent:#E8572A;            /* overwritten by brand.accent in content.js */
  --ink:#141110; --grey:#8A837E; --faint:#D9D2CC; --line:#ECE6DF;
  --bg:#FFFDF9; --soft:#F4F0EB;
  --pad:clamp(16px,2.5vw,32px);
  --radius:18px;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:150px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 "Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
.wrap{padding-inline:var(--pad)}
.label{color:var(--grey);font-size:1.05rem;font-weight:500}
.rule{border-top:1px solid var(--line)}
section{padding-block:clamp(64px,9vw,120px)}
.h2{font-size:clamp(2.2rem,5vw,4rem);font-weight:600;letter-spacing:-.045em;line-height:1.02}

/* pill buttons */
.pill{display:inline-flex;align-items:center;gap:10px;height:44px;padding:0 20px;border-radius:999px;background:var(--accent);color:#fff;font-weight:600;font-size:.95rem;transition:transform .3s var(--ease),filter .2s,background .2s;white-space:nowrap}
.pill:hover{transform:translateY(-2px);filter:brightness(1.06)}
.pill.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.pill.dark{background:var(--ink)}
.pill-arrow{padding-right:5px}
.pill-arrow i{width:34px;height:34px;border-radius:50%;background:#fff;color:var(--accent);display:grid;place-items:center;font-style:normal;transition:transform .35s var(--ease)}
.pill.dark.pill-arrow i{color:var(--ink)}
.pill-arrow:hover i{transform:rotate(45deg)}

/* ================= NAV ================= */
.nav{position:fixed;inset:0 0 auto;z-index:50;display:flex;align-items:center;justify-content:space-between;height:86px;padding-inline:var(--pad);color:#fff;transition:background .35s,color .35s}
.nav.solid{background:rgba(255,253,249,.8);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--ink)}
.brand{display:flex;align-items:center;gap:10px;font-weight:500;font-size:1.05rem}
.brand i{width:16px;height:16px;border-radius:50%;background:currentColor;transition:background .3s}
.brand:hover i{background:var(--accent)}
.nav ul{display:flex;align-items:center;gap:30px}
.nav ul a{font-size:.95rem;position:relative}
.nav ul a::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:1.5px;background:currentColor;transform:scaleX(0);transform-origin:right;transition:transform .3s var(--ease)}
.nav ul a:hover::after{transform:scaleX(1);transform-origin:left}
.nav .pill{margin-left:10px}
@media (max-width:860px){.nav ul li:not(:last-child){display:none}.nav{height:70px}}

/* ================= HERO ================= */
.hero{position:relative;height:100svh;min-height:560px;overflow:hidden;color:#fff;padding:0}
.hero-img{position:absolute;inset:0;width:100%;height:115%;object-fit:cover;animation:kenburns 22s ease-in-out infinite alternate}
@keyframes kenburns{from{transform:scale(1.02)}to{transform:scale(1.12)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.3) 0%,rgba(0,0,0,0) 28%,rgba(0,0,0,0) 48%,rgba(0,0,0,.58) 100%);pointer-events:none}
.hero-text{position:absolute;left:var(--pad);right:var(--pad);bottom:28px;z-index:2}
.hero .kicker{font-size:1rem;font-weight:500;opacity:.92;margin-bottom:6px}
.hero h1{font-size:clamp(2.4rem,10.5vw,10rem);font-weight:600;letter-spacing:-.045em;line-height:.92;text-transform:uppercase}
.hero h1 .ch{display:inline-block;animation:rise 1s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(40%)}}
.hero-meta{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-top:22px;font-size:1rem}
.hero-meta span:last-child{text-align:right}
.hero-meta .scroll b{display:inline-block;animation:nudge 1.8s ease-in-out infinite;font-weight:400;margin-left:6px}
@keyframes nudge{50%{transform:translateY(4px)}}

/* ================= ABOUT ================= */
.about{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}
.about .label{grid-column:1/-1;margin-bottom:-12px}
.about-img{width:min(220px,40vw);aspect-ratio:1;border-radius:28px;object-fit:cover;transition:transform .5s var(--ease),border-radius .5s var(--ease)}
.about-img:hover{transform:rotate(-3deg) scale(1.03);border-radius:50%}
.about p.big{font-size:clamp(1.3rem,2.2vw,1.85rem);line-height:1.32;letter-spacing:-.015em;font-weight:500}
.about .w{transition:opacity .25s}
@media (max-width:760px){.about{grid-template-columns:1fr}}

/* ================= SOLUTIONS (what we do) ================= */
.sol-head{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:end;margin-top:28px}
.sol-head p{color:var(--grey);font-size:1.15rem;max-width:44ch}
@media (max-width:760px){.sol-head{grid-template-columns:1fr;gap:16px}}
.tabs{position:sticky;top:96px;z-index:30;display:flex;justify-content:center;margin:48px 0 8px;pointer-events:none}
@media (max-width:860px){.tabs{top:80px}}
.tabs-in{pointer-events:auto;position:relative;display:flex;gap:2px;padding:5px;border-radius:999px;background:rgba(244,240,235,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 8px 30px -12px rgba(0,0,0,.18);overflow-x:auto;max-width:100%;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tabs a{position:relative;z-index:1;padding:10px 18px;border-radius:999px;font-size:.92rem;font-weight:500;color:var(--grey);white-space:nowrap;transition:color .3s}
.tabs a.on{color:#fff}
.tabs .knob{position:absolute;top:5px;bottom:5px;left:0;width:0;border-radius:999px;background:var(--ink);transition:left .45s var(--ease),width .45s var(--ease)}
.sol{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,5vw,72px);align-items:center;padding-block:clamp(40px,6vw,72px)}
.sol:nth-child(even) .sol-img{order:2}
@media (max-width:760px){.sol{grid-template-columns:1fr}.sol:nth-child(even) .sol-img{order:0}}
.sol-img{overflow:hidden;border-radius:6px;aspect-ratio:1/1}
.sol-img img{width:100%;height:100%;object-fit:cover;transition:transform 1s var(--ease)}
.sol:hover .sol-img img{transform:scale(1.04)}
.sol .idx{color:var(--accent);font-weight:600;font-size:.95rem}
.sol h3{font-size:clamp(2rem,4vw,3.4rem);font-weight:600;letter-spacing:-.045em;line-height:1.02;margin:10px 0 14px}
.sol .beats{font-size:1.2rem;color:#4a423e;margin-bottom:26px}
.sol .more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .55s var(--ease)}
.sol.open .more{grid-template-rows:1fr}
.sol .more>div{overflow:hidden}
.sol .more li{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.sol .more li::before{content:"↗";color:var(--accent)}
.sol .more .price{color:var(--grey);margin:14px 0 22px;font-weight:500}
.sol .toggle i{transition:transform .4s var(--ease)}
.sol.open .toggle i{transform:rotate(135deg)}

/* ================= CAPABILITIES (scroll-lit words) ================= */
.caps{text-align:center}
.caps .label{margin-bottom:30px}
.caps li{font-size:clamp(2.2rem,7.2vw,6.4rem);font-weight:700;letter-spacing:-.05em;line-height:1.02;text-transform:uppercase;color:var(--faint);transition:color .35s var(--ease)}
.caps li.lit{color:var(--ink)}
.caps li.lit::after{content:"";display:inline-block;width:.22em;height:.22em;border-radius:50%;background:var(--accent);margin-left:.08em;vertical-align:baseline}

/* ================= WORK ================= */
.work-head{display:flex;justify-content:space-between;align-items:center;padding-top:24px;margin-bottom:40px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:28px 16px}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
.card{display:block;text-align:left;width:100%;position:relative;cursor:pointer}
.card .frame{overflow:hidden;border-radius:4px;aspect-ratio:16/11;background:var(--soft)}
.card img{width:100%;height:100%;object-fit:cover;transition:transform .9s var(--ease)}
.card:hover img{transform:scale(1.045)}
.card .cap{display:flex;justify-content:space-between;gap:16px;padding-top:10px;font-size:.98rem}
.card .cap span:last-child{color:var(--grey);text-align:right}
.card:hover .cap span:first-child{color:var(--accent)}
.center{display:flex;justify-content:center;margin-top:56px}
#cursor{position:fixed;left:0;top:0;width:86px;height:86px;margin:-43px 0 0 -43px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:.85rem;font-weight:600;pointer-events:none;z-index:40;transform:scale(0);transition:transform .3s var(--ease)}
#cursor.on{transform:scale(1)}
@media (hover:none){#cursor{display:none}}

/* ================= STATS + MARQUEE ================= */
.stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:20px}
.stats b{display:block;font-size:clamp(3rem,6vw,4.6rem);font-weight:600;letter-spacing:-.05em;line-height:1}
.stats span{color:var(--grey);font-size:clamp(1rem,1.6vw,1.35rem);font-weight:500;letter-spacing:-.01em}
@media (max-width:560px){.stats{grid-template-columns:1fr;gap:36px}}
.marquee{overflow:hidden;margin-top:clamp(56px,7vw,90px);-webkit-mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.marquee-track{display:flex;gap:64px;width:max-content;animation:marquee 32s linear infinite}
.marquee:hover .marquee-track{animation-play-state:paused}
.marquee-track span{font-size:clamp(1.8rem,3.6vw,3rem);font-weight:700;font-style:italic;letter-spacing:-.04em;white-space:nowrap;color:#2a2421}
.marquee-track span:nth-child(even){color:#bdb4ad}
@keyframes marquee{to{transform:translateX(-50%)}}
body.editing .marquee-track{animation:none;flex-wrap:wrap;width:auto}

/* ================= MATCH ================= */
.match{background:var(--soft);border-radius:var(--radius);margin-inline:var(--pad);padding:clamp(40px,6vw,80px) var(--pad)}
.match .q{font-size:clamp(1.8rem,4.4vw,3.6rem);font-weight:600;letter-spacing:-.04em;line-height:1.12;margin:18px 0 22px;max-width:18ch}
.slot{display:inline-block;color:var(--accent)}
.slot.flip{animation:flip .45s var(--ease)}
@keyframes flip{from{opacity:0;transform:translateY(.5em)}}
.match .idea{font-size:1.2rem;color:#4a423e;max-width:46ch;min-height:3.2em;transition:opacity .3s}
.match .row{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.shuffle i{display:inline-block;font-style:normal;transition:transform .5s var(--ease)}
.shuffle:hover i{transform:rotate(180deg)}

/* ================= HOW ================= */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:40px}
@media (max-width:900px){.steps{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.steps{grid-template-columns:1fr}}
.step{padding-top:18px;position:relative}
.step::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:var(--line)}
.step::after{content:"";position:absolute;top:0;left:0;height:2px;width:0;background:var(--accent);transition:width .8s var(--ease)}
.step.in::after{width:100%}
.step:nth-child(2)::after{transition-delay:.15s}.step:nth-child(3)::after{transition-delay:.3s}.step:nth-child(4)::after{transition-delay:.45s}
.step em{font-style:normal;color:var(--grey);font-size:.9rem;font-weight:500}
.step h3{font-size:1.45rem;font-weight:600;letter-spacing:-.02em;margin:10px 0 8px}
.step p{color:var(--grey)}

/* ================= PRICING ================= */
.svc{margin-top:36px;border-top:1px solid var(--line)}
.svc details{border-bottom:1px solid var(--line)}
.svc summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr auto 40px;align-items:center;gap:16px;padding:24px 0;font-size:clamp(1.2rem,2.4vw,1.75rem);font-weight:500;letter-spacing:-.02em;transition:color .2s}
.svc summary::-webkit-details-marker{display:none}
.svc summary:hover{color:var(--accent)}
.svc .price{font-size:1rem;color:var(--grey);font-weight:500;letter-spacing:0}
.svc .pm{width:32px;height:32px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line);display:grid;place-items:center;font-size:1.1rem;transition:transform .35s var(--ease),background .3s,color .3s}
.svc details[open] .pm{transform:rotate(45deg);background:var(--accent);color:#fff;box-shadow:none}
.svc details p{color:var(--grey);max-width:60ch;padding:0 0 24px;font-size:1.05rem}
.svc-note{margin-top:22px;color:var(--grey)}
.svc-note::before{content:"● ";color:var(--accent)}

/* ================= SUPPERS ================= */
.supper{position:relative;margin-inline:var(--pad);border-radius:var(--radius);overflow:hidden;min-height:clamp(440px,60vw,640px);color:#fff;display:flex;align-items:flex-end}
.supper>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}
.supper:hover>img{transform:scale(1.03)}
.supper::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.62),rgba(0,0,0,0) 65%);pointer-events:none}
.supper-text{position:relative;z-index:2;padding:clamp(24px,4vw,48px);max-width:640px}
.supper h2{font-size:clamp(2rem,4.4vw,3.6rem);font-weight:600;letter-spacing:-.04em;line-height:1.05;margin:8px 0 14px}
.supper p{opacity:.92;margin-bottom:24px;font-size:1.08rem}
.supper .label{color:rgba(255,255,255,.8)}

/* ================= CTA + NEWSLETTER + FOOTER ================= */
.cta{text-align:center}
.cta h2{font-size:clamp(1.9rem,4.2vw,3.2rem);font-weight:500;letter-spacing:-.035em;color:var(--accent);margin-bottom:28px}
.cta .pill{height:48px;padding:0 26px;font-size:1.02rem;box-shadow:0 10px 24px -10px var(--accent)}
footer{background:var(--soft);padding:clamp(56px,7vw,96px) var(--pad) 40px}
.news{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;padding-bottom:clamp(48px,6vw,80px);border-bottom:1px solid var(--faint)}
.news h3{font-size:clamp(1.6rem,3vw,2.4rem);font-weight:600;letter-spacing:-.035em}
.news p{color:var(--grey);margin-top:6px}
.news form{display:flex;gap:8px;background:#fff;border-radius:999px;padding:6px;box-shadow:inset 0 0 0 1.5px var(--line);transition:box-shadow .2s}
.news form:focus-within{box-shadow:inset 0 0 0 1.5px var(--accent)}
.news input{flex:1;min-width:0;border:0;background:none;font:inherit;padding:0 16px;color:var(--ink);outline:0}
.news>*{min-width:0}
@media (max-width:760px){.news{grid-template-columns:1fr}}
.foot{display:grid;grid-template-columns:1fr 1fr;gap:40px;padding-top:clamp(48px,6vw,80px)}
.foot-links{display:grid;grid-template-columns:auto auto;gap:6px 48px;align-content:start;width:max-content}
.foot-links a{font-size:1.05rem}
.foot-links a:hover{color:var(--accent)}
.foot-contacts{display:grid;grid-template-columns:auto 1fr;gap:24px 56px}
.foot-contacts .big{font-size:clamp(1.2rem,2.4vw,1.9rem);text-transform:uppercase;letter-spacing:-.01em;word-break:break-all}
.foot-contacts .big:hover{color:var(--accent)}
.social{display:flex;gap:16px;font-size:1.15rem;grid-column:2}
.social a:hover{color:var(--accent)}
.social span{color:var(--grey)}
.copy{text-align:center;color:var(--grey);margin-top:80px;font-weight:500}
@media (max-width:760px){.foot{grid-template-columns:1fr}.foot-contacts{grid-template-columns:1fr;gap:10px}.social{grid-column:auto;margin-top:16px}}

/* ================= MODALS ================= */
dialog{border:0;padding:0;border-radius:var(--radius);width:min(720px,calc(100% - 32px));max-height:calc(100svh - 32px);background:var(--bg);color:var(--ink);box-shadow:0 40px 100px -30px rgba(0,0,0,.45)}
dialog::backdrop{background:rgba(20,17,16,.45);backdrop-filter:blur(6px)}
dialog[open]{animation:pop .45s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.98)}}
.x{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;font-size:1.4rem;z-index:2}
.case img{width:100%;aspect-ratio:16/9;object-fit:cover}
.case-body{padding:28px clamp(20px,4vw,36px) 34px}
.case-body h3{font-size:1.9rem;font-weight:600;letter-spacing:-.03em;margin:6px 0 12px}
.case-body .result{margin:18px 0 26px;padding:16px 18px;background:var(--soft);border-radius:12px}
.case-body .result b{display:block;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-bottom:2px}
.contact{padding:clamp(24px,4vw,40px)}
.contact h3{font-size:1.8rem;font-weight:600;letter-spacing:-.03em;margin-bottom:6px}
.contact .sub{color:var(--grey);margin-bottom:24px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{height:40px;padding:0 16px;border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--line);font-weight:500;transition:all .2s}
.chip:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:none}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:.85rem;color:var(--grey);margin-bottom:6px;font-weight:500}
.field input,.field textarea{width:100%;font:inherit;padding:13px 15px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink);transition:border-color .2s}
.field input:focus,.field textarea:focus{outline:0;border-color:var(--accent)}
.thanks{text-align:center}
.thanks b{display:block;font-size:3rem;margin-bottom:8px}

/* reveal on scroll */
.rv{opacity:0;transform:translateY(22px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.rv.in{opacity:1;transform:none}

/* ================= EDIT MODE (open the page with ?edit) ================= */
#editbar{display:none}
body.editing #editbar{display:flex;position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:100;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;background:#141110;color:#fff;padding:8px;border-radius:28px;box-shadow:0 20px 50px -10px rgba(0,0,0,.5);font-size:.88rem;width:max-content;max-width:calc(100% - 24px)}
#editbar .t{padding:0 10px 0 14px;opacity:.75}
#editbar button,#editbar label{height:36px;padding:0 14px;border-radius:999px;background:#2b2523;display:inline-flex;align-items:center;gap:8px;cursor:pointer}
#editbar button.main{background:var(--accent)}
#editbar input[type=color]{width:22px;height:22px;border:0;padding:0;background:none;cursor:pointer}
body.editing [data-k]{outline:1.5px dashed color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:4px;border-radius:4px;cursor:text}
body.editing [data-k]:focus{outline:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 7%,transparent)}
body.editing [data-img]{cursor:copy}
body.editing .imgwrap{position:relative;outline:3px dashed var(--accent);outline-offset:-3px}
body.editing .imgwrap::before{content:"Click image to replace";position:absolute;top:12px;left:12px;z-index:5;background:var(--accent);color:#fff;font-size:.78rem;font-weight:600;padding:6px 10px;border-radius:999px;pointer-events:none}
.edit-only{display:none!important}
body.editing .edit-only{display:inline-flex!important}
.mini{position:absolute;top:12px;right:12px;z-index:6;height:32px;padding:0 12px;border-radius:999px;background:#141110;color:#fff;font-size:.8rem;align-items:center}
.addcard{border:2px dashed var(--faint);border-radius:4px;aspect-ratio:16/11;display:grid;place-items:center;color:var(--grey);font-weight:600;width:100%}
.addcard:hover{border-color:var(--accent);color:var(--accent)}
body.editing .rv{opacity:1;transform:none}
body.editing .caps li{color:var(--ink)}
body.editing .sol .more{grid-template-rows:1fr}
#toast{position:fixed;left:50%;top:20px;transform:translate(-50%,-120px);visibility:hidden;background:#141110;color:#fff;padding:10px 18px;border-radius:999px;z-index:120;transition:transform .4s var(--ease);font-size:.9rem;max-width:calc(100% - 32px);text-align:center}
#toast.on{transform:translate(-50%,0);visibility:visible}

<header class="hero" id="top">
  <div class="imgwrap" style="position:absolute;inset:0"><img class="hero-img" id="heroImg" data-img="hero.image" alt=""></div>
  <div class="hero-text">
    <p class="kicker" data-k="hero.kicker"></p>
    <h1 id="heroTitle" data-k="hero.title"></h1>
    <div class="hero-meta">
      <span class="scroll"><span data-k="hero.scrollHint"></span><b>↓</b></span>
      <span id="clock" title="Singapore time">--:--</span>
      <span id="year"></span>
    </div>
  </div>
</header>

<main>
  <!-- WHO WE ARE -->
  <section class="wrap">
    <div class="about">
      <p class="label rv" data-k="about.label"></p>
      <div class="imgwrap rv" style="width:max-content"><img class="about-img" data-img="about.image" alt="About us"></div>
      <p class="big" id="aboutText" data-k="about.text"></p>
    </div>
  </section>

  <!-- WHAT WE DO -->
  <section class="wrap" id="what" style="padding-top:0">
    <div class="rule"></div>
    <div class="sol-head">
      <div><p class="label" data-k="solutions.label" style="margin-bottom:14px"></p><h2 class="h2 rv" data-k="solutions.title"></h2></div>
      <p class="rv" data-k="solutions.intro"></p>
    </div>
    <div class="tabs"><div class="tabs-in" id="tabs"><span class="knob" id="knob"></span></div></div>
    <div id="sols"></div>
  </section>

  <!-- CAPABILITIES -->
  <section class="wrap caps" style="padding-top:0">
    <p class="label" data-k="capabilities.label"></p>
    <ul id="caps"></ul>
  </section>

  <!-- SELECTED COLLABS -->
  <section class="wrap" id="work" style="padding-top:0">
    <div class="rule"></div>
    <div class="work-head"><p class="label" data-k="work.label"></p></div>
    <div class="grid" id="workGrid"></div>
    <div class="center"><button class="pill pill-arrow open-contact"><span data-k="work.more"></span><i>↗</i></button></div>
  </section>

  <!-- STATS + MARQUEE -->
  <section class="wrap" style="padding-top:0">
    <div class="stats" id="stats"></div>
    <div class="marquee"><div class="marquee-track" id="marquee"></div></div>
  </section>

  <!-- MATCH -->
  <div class="match rv" id="match">
    <p class="label" data-k="match.label"></p>
    <p class="q">What if <span class="slot" id="slotA"></span> met <span class="slot" id="slotB"></span>?</p>
    <p class="idea" id="ideaText"></p>
    <div class="row">
      <button class="pill ghost shuffle" id="shuffle"><i>↻</i> <span data-k="match.button"></span></button>
      <button class="pill" id="makeIt">Let's make it happen →</button>
    </div>
  </div>

  <!-- HOW -->
  <section class="wrap" id="how">
    <p class="label" data-k="how.label"></p>
    <div class="steps" id="steps"></div>
  </section>

  <!-- PRICING -->
  <section class="wrap" style="padding-top:0" id="pricing">
    <p class="label" data-k="services.label"></p>
    <div class="svc" id="svc"></div>
    <p class="svc-note" data-k="services.note"></p>
  </section>

  <!-- SUPPERS -->
  <div class="supper rv imgwrap" id="suppers">
    <img data-img="suppers.image" alt="A Common Table supper">
    <div class="supper-text">
      <p class="label" data-k="suppers.label"></p>
      <h2 data-k="suppers.title"></h2>
      <p data-k="suppers.text"></p>
      <button class="pill open-contact" data-ctx="I'd love a seat at the next supper." data-k="suppers.button"></button>
    </div>
  </div>

  <!-- CTA -->
  <section class="wrap cta">
    <h2 class="rv" data-k="cta.title"></h2>
    <button class="pill open-contact rv" data-k="cta.button"></button>
  </section>
</main>

  <div class="foot">

    </div>

    <p class="label" id="caseTags"></p><h3 id="caseTitle"></h3><p id="caseStory" style="color:#4a423e;font-size:1.08rem"></p>

<script>
(()=>{
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const Q=new URLSearchParams(location.search),EDIT=Q.has('edit'),PREVIEW=Q.has('preview');
const DRAFT='commontable-draft';
let C=JSON.parse(JSON.stringify(window.CONTENT||window.CT_FALLBACK));
const IMG=window.CT_IMAGES||{};
const src=p=>(!window.CONTENT&&IMG[p])||p;
document.addEventListener('error',e=>{const t=e.target;if(t.tagName==='IMG'){const k=t.getAttribute('src');if(IMG[k]&&t.src!==IMG[k])t.src=IMG[k]}},true);
if(EDIT||PREVIEW){try{const d=localStorage.getItem(DRAFT);if(d){C=JSON.parse(d);setTimeout(()=>toast(PREVIEW?'Previewing your edits. Download content.js from the editor to publish them':'Loaded your unsaved edits from this browser'),500)}}catch(e){}}

/* ---------- helpers ---------- */
const get=p=>p.split('.').reduce((o,k)=>o==null?o:o[k],C);
const set=(p,v)=>{const ks=p.split('.'),last=ks.pop();ks.reduce((o,k)=>o[k],C)[last]=v;save()};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function save(){if(!EDIT)return;try{localStorage.setItem(DRAFT,JSON.stringify(C))}catch(e){toast('Too big to autosave. Download content.js to keep your edits.')}}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2800)}

/* ---------- render lists from content ---------- */
function renderLists(){
  const S=C.solutions.items;
  $('#tabs').innerHTML='<span class="knob" id="knob"></span>'+S.map((s,i)=>`<a href="#sol-${i}" data-i="${i}" data-k="solutions.items.${i}.tab"></a>`).join('');
  $('#sols').innerHTML=S.map((s,i)=>`
    <article class="sol" id="sol-${i}">
      <div class="sol-img imgwrap rv"><img data-img="solutions.items.${i}.image" alt="" loading="lazy"></div>
      <div class="rv">
        <span class="idx">0${i+1} — <span data-k="solutions.items.${i}.tab"></span></span>
        <h3 data-k="solutions.items.${i}.title"></h3>
        <p class="beats" data-k="solutions.items.${i}.beats"></p>
        <div class="more"><div>
          <ul>${s.details.map((d,j)=>`<li><span data-k="solutions.items.${i}.details.${j}"></span></li>`).join('')}</ul>
          <p class="price" data-k="solutions.items.${i}.price"></p>
          <button class="pill dark open-contact" data-ctx="I'm interested in: ${esc(s.tab)}." style="margin-bottom:14px">Talk to us about this →</button>
        </div></div>
        <button class="pill pill-arrow toggle"><span data-k="solutions.items.${i}.button"></span><i>+</i></button>
      </div>
    </article>`).join('');
  $('#caps').innerHTML=C.capabilities.items.map((c,i)=>`<li data-k="capabilities.items.${i}"></li>`).join('');
  $('#workGrid').innerHTML=C.work.items.map((w,i)=>`
    <div class="card rv" data-i="${i}" role="button" tabindex="0" aria-label="${esc(w.title)}">
      <div class="frame imgwrap"><img data-img="work.items.${i}.image" alt="${esc(w.title)}" loading="lazy"></div>
      <div class="cap"><span data-k="work.items.${i}.title"></span><span data-k="work.items.${i}.tags"></span></div>
      <button class="mini edit-only" data-story="${i}" style="right:104px">Story</button>
      <button class="mini edit-only" data-rm="${i}">Remove</button>
    </div>`).join('')+(EDIT?`<button class="addcard" id="addWork">＋ Add a collab</button>`:'');
  $('#stats').innerHTML=C.stats.map((s,i)=>`<div class="rv"><b><span class="num" data-k="stats.${i}.number"></span><span data-k="stats.${i}.suffix"></span></b><span data-k="stats.${i}.label"></span></div>`).join('');
  const one=C.marquee.map((x,i)=>`<span data-k="marquee.${i}"></span>`).join('');
  $('#marquee').innerHTML=one+(EDIT?'':C.marquee.map(x=>`<span aria-hidden="true">${esc(x)}</span>`).join(''));
  $('#steps').innerHTML=C.how.steps.map((s,i)=>`<div class="step rv"><em>0${i+1}</em><h3 data-k="how.steps.${i}.title"></h3><p data-k="how.steps.${i}.text"></p></div>`).join('');
  $('#svc').innerHTML=C.services.items.map((s,i)=>`<details${i===2?' open':''}><summary><span data-k="services.items.${i}.name"></span><span class="price" data-k="services.items.${i}.price"></span><span class="pm">+</span></summary><p data-k="services.items.${i}.detail"></p></details>`).join('');
}
function fill(){
  document.documentElement.style.setProperty('--accent',C.brand.accent);
  $$('[data-k]').forEach(el=>{if(el===document.activeElement)return;const v=get(el.dataset.k);el.textContent=v??''});
  $$('[data-img]').forEach(el=>{const v=src(get(el.dataset.img));if(v&&el.getAttribute('src')!==v)el.src=v});
  $('#mail').textContent=C.brand.email;$('#mail').href='mailto:'+C.brand.email;
  $('#ig').href=C.brand.instagram||'#';$('#li').href=C.brand.linkedin||'#';
  $('#brandName2').textContent=C.brand.name;
  const y=new Date().getFullYear();$('#year').textContent=y;$('#year2').textContent=y;
}
function render(){renderLists();fill();if(EDIT){wireEditable()}else{animateTitle();splitAbout();observe()}bindCards();bindSolutions();placeKnob()}

/* ---------- hero ---------- */
function animateTitle(){if(reduce)return;const h=$('#heroTitle');let n=0;h.innerHTML=C.hero.title.split(' ').map(w=>`<span style="white-space:nowrap;display:inline-block">${[...w].map(c=>`<span class="ch" style="animation-delay:${.15+(n++)*.035}s">${esc(c)}</span>`).join('')}</span>`).join(' ')}
function tick(){$('#clock').textContent=new Intl.DateTimeFormat('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Singapore'}).format(new Date())}
tick();setInterval(tick,15000);

/* ---------- scroll effects ---------- */
const nav=$('#nav');
function onScroll(){
  nav.classList.toggle('solid',scrollY>innerHeight-90);
  if(!reduce)$('#heroImg').style.translate=`0 ${Math.min(scrollY,innerHeight)*.25}px`;
  aboutProgress();litCaps();activeTab();
}
addEventListener('scroll',()=>requestAnimationFrame(onScroll),{passive:true});
addEventListener('resize',()=>{placeKnob();onScroll()});

function splitAbout(){const p=$('#aboutText');p.innerHTML=C.about.text.split(/(\s+)/).map(w=>/\s/.test(w)?w:`<span class="w">${esc(w)}</span>`).join('')}
function aboutProgress(){if(EDIT||reduce)return;const p=$('#aboutText'),ws=p.querySelectorAll('.w');if(!ws.length)return;
  const r=p.getBoundingClientRect(),prog=Math.min(1,Math.max(0,(innerHeight*.85-r.top)/(r.height+innerHeight*.3)));
  const n=Math.round(prog*ws.length);ws.forEach((w,i)=>w.style.opacity=i<n?1:.18)}
function litCaps(){if(EDIT)return;const mid=innerHeight*.5;$$('#caps li').forEach(li=>{const r=li.getBoundingClientRect();li.classList.toggle('lit',r.top<mid+r.height*.6&&r.bottom>mid-r.height*.6)})}

let io;
function observe(){io?.disconnect();io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;e.target.classList.add('in');
  e.target.querySelectorAll('.num').forEach(countUp);io.unobserve(e.target)}),{threshold:.15});
  $$('.rv').forEach(el=>reduce?el.classList.add('in'):io.observe(el))}
function countUp(el){const end=parseFloat(el.textContent);if(isNaN(end)||reduce)return;const t0=performance.now(),d=1400;
  (function f(t){const p=Math.min(1,(t-t0)/d);el.textContent=Math.round(end*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0)}

/* ---------- solutions: sticky tabs + explore ---------- */
let curTab=0;
function placeKnob(){const a=$$('#tabs a')[curTab],k=$('#knob');if(!a||!k)return;k.style.left=a.offsetLeft+'px';k.style.width=a.offsetWidth+'px';$$('#tabs a').forEach((x,i)=>x.classList.toggle('on',i===curTab))}
function activeTab(){const secs=$$('.sol');let best=0;secs.forEach((s,i)=>{if(s.getBoundingClientRect().top<innerHeight*.45)best=i});if(best!==curTab){curTab=best;placeKnob();
  const a=$$('#tabs a')[curTab];a?.parentElement.scrollTo({left:a.offsetLeft-40,behavior:'smooth'})}}
function bindSolutions(){
  $$('#tabs a').forEach(a=>a.addEventListener('click',e=>{if(EDIT){e.preventDefault();return}}));
  $$('.sol .toggle').forEach(b=>b.onclick=e=>{if(EDIT&&e.target.closest('[data-k]'))return;b.closest('.sol').classList.toggle('open')});
}

/* ---------- work cards ---------- */
const cur=$('#cursor');
addEventListener('mousemove',e=>{cur.style.left=e.clientX+'px';cur.style.top=e.clientY+'px'},{passive:true});
function bindCards(){
  $$('.card .frame').forEach(f=>{f.onmouseenter=()=>{if(!EDIT)cur.classList.add('on')};f.onmouseleave=()=>cur.classList.remove('on')});
  $$('.card').forEach(c=>{const open=e=>{if(EDIT)return;openCase(+c.dataset.i)};c.onclick=open;c.onkeydown=e=>{if(e.key==='Enter')open(e)}});
}
const caseDlg=$('#caseDlg'),contactDlg=$('#contactDlg');
function openCase(i){const w=C.work.items[i];$('#caseImg').src=src(w.image);$('#caseImg').alt=w.title;$('#caseTags').textContent=w.tags;
  $('#caseTitle').textContent=w.title;$('#caseStory').textContent=w.story;$('#caseResult').textContent=w.result;
  $('#caseCta').dataset.ctx=`I'd love a collab like "${w.title}".`;cur.classList.remove('on');caseDlg.showModal()}
$$('[data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close());
[caseDlg,contactDlg].forEach(d=>d.addEventListener('click',e=>{if(e.target===d)d.close()}));

/* ---------- match shuffle ---------- */
let mi=-1;
function shuffle(){const L=C.match.ideas;let n;do{n=Math.floor(Math.random()*L.length)}while(n===mi&&L.length>1);mi=n;const it=L[n];
  [['#slotA',it.a],['#slotB',it.b]].forEach(([s,v],k)=>setTimeout(()=>{const el=$(s);el.classList.remove('flip');void el.offsetWidth;el.textContent=v;el.classList.add('flip')},k*120));
  const id=$('#ideaText');id.style.opacity=0;setTimeout(()=>{id.textContent=it.idea;id.style.opacity=1},220)}
$('#shuffle').onclick=e=>{if(EDIT&&e.target.closest('[data-k]'))return;shuffle()};
$('#makeIt').onclick=()=>{const it=C.match.ideas[mi];openContact(`What if ${it.a} met ${it.b}? ${it.idea}`)};

/* ---------- contact + newsletter ---------- */
function openContact(ctx){if(EDIT)return;caseDlg.close();$('#cMsg').value=ctx||'';contactDlg.showModal();setTimeout(()=>$('#cName').focus(),60)}
document.addEventListener('click',e=>{const b=e.target.closest('.open-contact');if(b&&!EDIT){e.preventDefault();openContact(b.dataset.ctx)}});
$$('.chip').forEach(c=>c.onclick=()=>$$('.chip').forEach(x=>x.setAttribute('aria-pressed',x===c)));
async function send(data,subject,body){
  if(C.brand.formEndpoint){try{const r=await fetch(C.brand.formEndpoint,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(data)});if(r.ok)return}catch(e){}}
  location.href=`mailto:${C.brand.email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}
$('#contactForm').addEventListener('submit',async e=>{e.preventDefault();
  const name=$('#cName'),email=$('#cEmail');
  if(!name.value.trim()){name.focus();return} if(!email.value||!email.checkValidity()){email.focus();return}
  const who=$('.chip[aria-pressed="true"]')?.textContent||'';
  const data={name:name.value.trim(),email:email.value.trim(),type:who,message:$('#cMsg').value.trim()};
  await send(data,'Hello from '+data.name,`Hi ${C.brand.name},\n\nI'm ${data.name}${who?` (${who})`:''}.\n\n${data.message}\n\n${data.email}`);
  const t=document.createElement('div');t.className='contact thanks';t.innerHTML='<b>☕</b><h3></h3><p class="sub">We\'ll be in touch within two working days.</p>';
  t.querySelector('h3').textContent=`Thank you, ${data.name.split(' ')[0]}!`;e.target.replaceWith(t)});
$('#newsForm').addEventListener('submit',async e=>{e.preventDefault();const em=$('#newsEmail');if(!em.checkValidity()){em.focus();return}
  if(EDIT)return;await send({email:em.value,type:'newsletter'},'Newsletter sign-up',`Please add ${em.value} to the newsletter.`);
  e.target.innerHTML='<span style="padding:10px 16px;font-weight:600">You\'re on the list ✓</span>'});

/* ---------- edit mode ---------- */
function wireEditable(){
  $$('[data-k]').forEach(el=>{if(el._w)return;el._w=1;
    try{el.contentEditable='plaintext-only'}catch(e){} if(el.contentEditable!=='plaintext-only')el.contentEditable='true';
    el.addEventListener('input',()=>{set(el.dataset.k,el.innerText.trim());$$(`[data-k="${el.dataset.k}"]`).forEach(o=>{if(o!==el)o.textContent=el.innerText.trim()})});
    el.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();el.blur()}});
    el.addEventListener('click',e=>{e.preventDefault();e.stopPropagation()});
    el.addEventListener('paste',e=>{e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain'))})});
  $$('[data-img]').forEach(img=>{img.onclick=e=>{e.preventDefault();e.stopPropagation();pickImage(img.dataset.img)}});
  $$('[data-rm]').forEach(b=>b.onclick=e=>{e.stopPropagation();if(confirm('Remove this collab?')){C.work.items.splice(+b.dataset.rm,1);save();render()}});
  $$('[data-story]').forEach(b=>b.onclick=e=>{e.stopPropagation();const w=C.work.items[+b.dataset.story];
    const s=prompt('The story (shown when someone opens this collab):',w.story);if(s!==null)w.story=s;
    const r=prompt('The result:',w.result);if(r!==null)w.result=r;save();toast('Story saved')});
  $('#addWork')?.addEventListener('click',()=>{C.work.items.push({title:'New collab',tags:'Partner × Partner',image:'images/work-1.svg',story:'What was the story?',result:'What happened?'});save();render();toast('Added. Click its text and image to fill it in')});
}
let imgTarget=null;
function pickImage(path){imgTarget=path;$('#filePick').value='';$('#filePick').click()}
$('#filePick').addEventListener('change',e=>{const f=e.target.files[0];if(!f||!imgTarget)return;
  const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{
    const max=/^(hero|suppers)/.test(imgTarget)?2000:1400,s=Math.min(1,max/Math.max(im.width,im.height));
    const cv=document.createElement('canvas');cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
    set(imgTarget,cv.toDataURL('image/jpeg',.82));fill();toast('Image replaced')};im.src=rd.result};rd.readAsDataURL(f)});
if(EDIT){
  document.body.classList.add('editing');
  const ap=$('#accentPick');ap.value=C.brand.accent;ap.oninput=()=>{C.brand.accent=ap.value;document.documentElement.style.setProperty('--accent',ap.value);save()};
  $('#dl').onclick=()=>{const head=`/* COMMON TABLE: SITE CONTENT\n   Saved from the editor on ${new Date().toLocaleString()}.\n   Replace the old content.js in your website folder with this file.\n   Open index.html?edit to edit again. */\n\n`;
    const blob=new Blob([head+'window.CONTENT = '+JSON.stringify(C,null,2)+';\n'],{type:'text/javascript'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='content.js';a.click();toast('Downloaded. Replace content.js in your website folder')};
  $('#reset').onclick=()=>{if(confirm('Throw away your edits and go back to the saved content.js?')){localStorage.removeItem(DRAFT);location.reload()}};
  $('#exitEdit').onclick=()=>{save();location.href=location.pathname+'?preview'};
}

render();shuffle();onScroll();
addEventListener('load',placeKnob);
})();
</script>
</body>
</html>
